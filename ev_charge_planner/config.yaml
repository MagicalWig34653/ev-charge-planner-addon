---
name: EV Charge Planner
version: "0.2.0"
slug: ev_charge_planner
description: >-
  Plant das Laden eines Elektroautos nach dynamischen Strompreisen (Tibber) und schaltet
  die Wallbox. Steuert eine echte Wallbox.
url: "https://github.com/MagicalWig34653/ev-charge-planner-addon"

arch:
  - amd64
  - aarch64

# Das Abbild, das .github/workflows/release.yml im Anwendungsprojekt nach ghcr.io
# veröffentlicht. Der Supervisor hängt ":{version}" selbst an -- die Version oben muss zu
# einem vorhandenen Semver-Tag passen (Git-Tag "v0.2.0" -> Abbild-Tag "0.2.0").
image: "ghcr.io/magicalwig34653/ev-charge-planner"

# docker/entrypoint.sh ist PID 1 und startet gunicorn per exec -- kein s6-Overlay.
init: false

ingress: true
# Der Port, auf dem gunicorn im Container lauscht. NICHT 0: das hieße "der Supervisor wählt
# einen Port", und niemand horchte dort.
ingress_port: 5000
panel_icon: mdi:ev-plug-type2
panel_title: "Ladeplanung"
panel_admin: false

# Direkter Zugang, etwa für ein iframe-Widget oder einen Reverse Proxy. EV Charge Planner hat
# KEINE eigene Anmeldung: wer diesen Port erreicht, kann alles einstellen und die Wallbox
# schalten. Unter "Konfiguration -> Netzwerk" leeren, wenn er nicht gebraucht wird.
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: Direkter Zugang ohne Anmeldung -- geht an Home Assistant vorbei

startup: application
boot: auto

# Zertifikate für MQTT-TLS aus dem Home-Assistant-Ordner ssl -- nur lesend.
map:
  - type: ssl
    read_only: true

# Optionen bewusst flach: der Supervisor prüft die abgeschickte Konfiguration gegen das
# Schema, und eine leer gelassene verschachtelte Gruppe fehlt darin ("Missing option").
# Abgebildet in docker/addon_options.py im Anwendungsprojekt -- Namen hier und dort gleich.
options:
  dry_run: false
  verbose_debug: false
  database_type: sqlite
  mqtt_port: 1883
  mqtt_tls: false
  mqtt_base_topic: evplanner
  ha_discovery_prefix: homeassistant

schema:
  # EVCP_DRY_RUN: sperrt Wallbox-Schaltbefehle, MQTT-Veröffentlichungen, Benachrichtigungen
  # UND jedes Speichern in der Datenbank.
  dry_run: "bool"
  # EVCP_VERBOSE_DEBUG
  verbose_debug: "bool"

  # DATABASE_URL: SQLite unter /data (Vorgabe) oder MariaDB aus den Einzelfeldern.
  database_type: "list(sqlite|mariadb)"
  database_host: "str?"
  database_port: "port?"
  database_user: "str?"
  database_password: "password?"
  database_name: "str?"

  # MQTT_HOST/PORT/USER/PASS/TLS/TLS_CA/BASE_TOPIC, HA_DISCOVERY_PREFIX
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  mqtt_tls: "bool?"
  mqtt_ca_cert: "str?"
  mqtt_base_topic: "str?"
  ha_discovery_prefix: "str?"

  # Auffangfeld: Inhalt einer .env, eine Zuweisung je Zeile. Gilt nach den Feldern oben.
  env: "str?"
